<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virginia Place Assigment</title>
    <meta name="author" content="Brandon Adolf">
    <meta name="description" content="Webpage About Virginia">
    <link rel="stylesheet" href="styles/place.css">
    <script src="scripts/place.js" defer></script>

    <!-- FONT IMPORT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <!-- END FONT -->
</head>

<body>
    <header>
        <h1>Virgina, United States</h1>
    </header>
    <main>
        <picture class="hero">
            <source media="(min-width:400px)" srcset="images/blue-ridge-mountians.webp">
            <img src="images/red-cardinal.webp" alt="Virginia State Bird - Red Cardinal">
        </picture>
        <section id="data">
            <h3>Data</h3>
            <table>
                <tr>
                    <th>Area:</th>
                    <td>42,774.2 sq mi</td>
                </tr>
                <tr>
                    <th>Population:</th>
                    <td>8,715,698</td>
                </tr>
                <tr>
                    <th>Capital:</th>
                    <td>Richmond</td>
                </tr>
                <tr>
                    <th>Language:</th>
                    <td>English</td>
                </tr>
                <tr>
                    <th>Currency:</th>
                    <td>USD $</td>
                </tr>
                <tr>
                    <th>Time Zone:</th>
                    <td>UTC-04:00</td>
                </tr>
            </table>
        </section>
        <section id="weather">
            <h3>Weather<span id="mini"></span></h3>
            <img id="icon" src="images/cloud_sun_rain_icon.svg" alt="cloud sun and rain weather icon">
            <table>
                <tr>
                    <th>Temperature:</th>
                    <td id="temperature">75 °F</td>
                </tr>
                <tr>
                    <th>Conditions:</th>
                    <td>Thunderstorms</td>
                </tr>
                <tr>
                    <th>Wind:</th>
                    <td id="windSpeed">4 MPH</td>
                </tr>
                <tr>
                    <th>Wind Chill:</th>
                    <td id="windChill"></td>
                </tr>
            </table>
        </section>
    </main>
    <footer>
        <p><span id="currentyear"></span> Brandon Adolf - Virginia, United States</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
